name: Studio macOS Apple Silicon DMG
on:
  workflow_dispatch:
  push:
    branches: [build/studio-macos-dmg]
permissions:
  contents: read
concurrency:
  group: studio-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dmg:
    if: github.repository == 'Brietat71/vinkulum-public'
    permissions:
      contents: write
    runs-on: macos-14
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
          architecture: arm64
      - name: Build native kernel and install Studio
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          python -m pip install 'maturin>=1.15,<2' 'pyinstaller==6.22.2'
          maturin build --release --locked --interpreter python --out dist/wheels
          python -m pip install dist/wheels/*.whl './apps/studio[test]'
      - name: Test native mechanics and desktop
        timeout-minutes: 5
        run: |
          python -m unittest vinkulum.test_charges_temporelles -v
          PY=$(command -v python) bash ci/studio.sh
      - name: Package and test standalone application
        run: bash ci/macos_dmg.sh
      - name: Publish tested DMG as a public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="studio-v0.3.0-macos-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/macos/*.dmg dist/macos/SHA256SUMS dist/macos/check/bundle-check.json dist/macos/check/scene.png --target "$GITHUB_SHA" --prerelease --title "Vinkulum Studio 0.3.0 — Apple Silicon preview ${GITHUB_RUN_NUMBER}" --notes-file apps/studio/packaging/RELEASE.md
