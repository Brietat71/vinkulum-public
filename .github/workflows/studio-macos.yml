name: Studio macOS Apple Silicon DMG
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dmg:
    if: github.repository == 'Brietat71/vinkulum-public'
    permissions:
      contents: write
    runs-on: macos-14
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      VINKULUM_STUDIO_CPUS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
          architecture: arm64
      - name: Build native kernel and install Studio
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          python -m pip install 'maturin>=1.15,<2' 'pyinstaller==6.22.2'
          maturin build --release --locked --interpreter python --out dist/wheels
          python ci/prepare_cad.py build/cad-sources
          python -m pip install dist/wheels/*.whl build/cad-sources/build123d-0.11.1 build/cad-sources/ocpsvg-0.6.0 './apps/studio[cad,test]'
      - name: Test native mechanics and desktop
        timeout-minutes: 15
        run: |
          python -m unittest vinkulum.test_charges_temporelles -v
          PY=$(command -v python) bash ci/studio.sh
      - name: Package and test standalone application
        run: bash ci/macos_dmg.sh
      - name: Publish tested DMG as a public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("apps/studio/pyproject.toml", "rb"))["project"]["version"])')
          tag="studio-v${version}-macos-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/macos/*.dmg dist/macos/SHA256SUMS dist/macos/build-info.json dist/macos/check/*.json dist/macos/check/*.png --target "$GITHUB_SHA" --prerelease --title "Vinkulum Studio ${version} — Apple Silicon preview ${GITHUB_RUN_NUMBER}" --notes-file apps/studio/packaging/RELEASE-MACOS.md
