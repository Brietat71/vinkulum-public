name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# La CI locale fait foi : aucune liste de tests dupliquée ici.
env:
  CARGO_BUILD_JOBS: "2"
  VINKULUM_BANCS_JOBS: "2"
  VINKULUM_BANCS_CPUS: "2"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

defaults:
  run:
    shell: bash

jobs:
  noyau:
    name: Noyau, preuves et bancs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Préparer Rust et Python
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
          python -m venv .venv
          .venv/bin/python -m pip install 'maturin>=1.15,<2' 'numpy>=1.26' 'scipy>=1.11'
      - name: Installer Lean 4.19.0 vérifié
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --no-same-owner --use-compress-program=unzstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Préparer Mathlib depuis le manifeste figé
        working-directory: preuves
        run: lake exe cache get
      - name: Vérifier les notices et la provenance
        run: .venv/bin/python ci/verifie_distribution.py
      - name: CI complète, bancs mécaniques et contacts
        run: |
          PY="$GITHUB_WORKSPACE/.venv/bin/python" MATURIN="$GITHUB_WORKSPACE/.venv/bin/maturin" ci/local.sh --bancs 2>&1 | tee "$RUNNER_TEMP/ci.log"
      - name: Conserver le journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journal-ci
          path: ${{ runner.temp }}/ci.log
          if-no-files-found: ignore
          retention-days: 14

  roue:
    name: Roue CPython 3.14 installée
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Construire la roue
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          python -m pip install 'maturin>=1.15,<2'
          maturin build --release --locked --interpreter python --out dist
      - name: Installer et vérifier hors du dépôt
        run: |
          python -m venv "$RUNNER_TEMP/roue-venv"
          "$RUNNER_TEMP/roue-venv/bin/python" -m pip install dist/*.whl 'scipy>=1.11'
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/roue-venv/bin/python" -m vinkulum.verification
          "$RUNNER_TEMP/roue-venv/bin/python" -c 'from importlib.metadata import metadata; from pathlib import Path; import vinkulum; p = Path(vinkulum.__file__).parent; assert metadata("vinkulum")["License-Expression"] == "Apache-2.0"; assert (p / "licences/modeles.json").is_file(); assert (p / "licences/rust.json").is_file()'
      - name: Conserver la roue vérifiée
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roue-cpython314-linux
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
      - name: Préparer le bureau de test Qt et OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y calculix-ccx xvfb xauth libegl1 libgl1 libgl1-mesa-dri \
            libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0t64 \
            libx11-6 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1
          command -v ccx
      - name: Construire et vérifier Studio 3D hors du dépôt
        env:
          RAYON_NUM_THREADS: "2"
          # Preserve the actual loader error if a platform plugin cannot start.
          QT_DEBUG_PLUGINS: "1"
          VINKULUM_STUDIO_SCREENSHOT: ${{ runner.temp }}/studio-g0.png
          VINKULUM_EDITOR_SCREENSHOT: ${{ runner.temp }}/studio-3d.png
          VINKULUM_3D_SCREENSHOT: ${{ runner.temp }}/viewport-3d.png
        run: |
          python -m pip wheel --no-deps ./apps/studio --wheel-dir "$RUNNER_TEMP/studio-dist"
          python ci/prepare_cad.py "$RUNNER_TEMP/cad-sources"
          "$RUNNER_TEMP/roue-venv/bin/python" -m pip install "$RUNNER_TEMP"/studio-dist/*.whl "$RUNNER_TEMP/cad-sources/build123d-0.11.1" "$RUNNER_TEMP/cad-sources/ocpsvg-0.6.0" 'scipy==1.18.1'
          "$RUNNER_TEMP/roue-venv/bin/python" -c 'import OCP, build123d; assert int(OCP.__version__.split(".")[0]) >= 8'
          cd "$RUNNER_TEMP"
          PY="$RUNNER_TEMP/roue-venv/bin/python" bash "$GITHUB_WORKSPACE/ci/studio.sh" 2>&1 | tee "$RUNNER_TEMP/studio-3d.log"
      - name: Qualify the separate Pinocchio worker
        run: |
          python -m venv "$RUNNER_TEMP/pinocchio-venv"
          "$RUNNER_TEMP/pinocchio-venv/bin/python" -m pip install --only-binary=:all: -r ci/pinocchio-linux-requirements.txt dist/*.whl "$RUNNER_TEMP"/studio-dist/*.whl
          "$RUNNER_TEMP/pinocchio-venv/bin/python" -m pip check
          "$RUNNER_TEMP/pinocchio-venv/bin/python" -c 'import pinocchio; assert pinocchio.__version__ == "4.1.0"'
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pinocchio-venv/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/apps/studio/tests" -p test_pinocchio.py -v 2>&1 | tee "$RUNNER_TEMP/pinocchio.log"
      - name: Qualify the desktop with the installed external Pinocchio worker
        env:
          VINKULUM_3D_TESTS: "1"
          QT_QPA_PLATFORM: xcb
          VINKULUM_PINOCCHIO_PYTHON: ${{ runner.temp }}/pinocchio-venv/bin/python
        run: |
          cd "$RUNNER_TEMP"
          xvfb-run -a -s '-screen 0 1600x1100x24' "$RUNNER_TEMP/roue-venv/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/apps/studio/tests" -p test_pinocchio_workspace.py -v 2>&1 | tee "$RUNNER_TEMP/pinocchio-workspace.log"
          xvfb-run -a -s '-screen 0 1600x1100x24' "$RUNNER_TEMP/roue-venv/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/apps/studio/tests" -p test_cad_history_workspace.py -k parametric -v 2>&1 | tee "$RUNNER_TEMP/cad-pinocchio.log"
      - name: Conserver la recette Studio
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-3d
          path: |
            ${{ runner.temp }}/studio-dist/*.whl
            ${{ runner.temp }}/studio-3d.log
            ${{ runner.temp }}/studio-g0.png
            ${{ runner.temp }}/studio-3d*.png
            ${{ runner.temp }}/viewport-3d.png
            ${{ runner.temp }}/pinocchio.log
            ${{ runner.temp }}/pinocchio-workspace.log
            ${{ runner.temp }}/cad-pinocchio.log
          if-no-files-found: ignore
          retention-days: 14
