[package]
name = "vinkulum"
version = "0.20.0"
edition = "2021"
description = "Vinkulum — noyau multicorps : intégrateur α-généralisé sur SO(3), liaisons rigides par contraintes"
license = "Apache-2.0"

[lib]
name = "vinkulum"
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = "0.33"
pyo3 = { version = "0.29", features = ["extension-module"] }
rayon = "1.10"
faer = "0.24"
num-bigint = "0.4.8"

[build-dependencies]
cc = "1.4"

[profile.release]
opt-level = 3
