[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vinkulum-studio"
version = "0.6.0a2.dev4"
description = "Open 3D CAD and multibody workbench for the Vinkulum kernel"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["vinkulum==0.20.0", "PySide6==6.11.2", "vtk==9.7.0"]

[project.optional-dependencies]
test = ["scipy==1.18.1"]
cad = [
    "cadquery-ocp-novtk==8.0.1.0.0",
    "build123d==0.11.1+vinkulum.occt8",
    "ocpsvg==0.6.0+vinkulum.occt8",
    "ocp_gordon==0.3.1",
]

[project.scripts]
vinkulum-studio = "vinkulum_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["vinkulum_studio*"]
