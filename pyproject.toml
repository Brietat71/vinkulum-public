[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "vinkulum"
version = "0.20.0"
description = "Vinkulum — noyau multicorps (Rust) : intégrateur α-généralisé sur SO(3), liaisons, poutres géométriquement exactes, contact, analyse modale et Floquet, sensibilités adjointes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "python/vinkulum/licences/**/*"]
authors = [{ name = "Paul Brintet" }]
keywords = ["multibody", "dynamics", "solver", "rotorcraft", "finite-element", "contact"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.14"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
reduction = ["scipy>=1.11"]
verification = ["scipy>=1.11"]   # python -m vinkulum.verification (références EDO indépendantes)
validation = ["scipy>=1.11", "neuralfoil"]  # python -m vinkulum.validation (polaires des essais)

[project.urls]
Repository = "https://github.com/Brietat71/vinkulum-public"
Issues = "https://github.com/Brietat71/vinkulum-public/issues"

[tool.maturin]
python-source = "python"
module-name = "vinkulum._vinkulum"
features = ["pyo3/extension-module"]
